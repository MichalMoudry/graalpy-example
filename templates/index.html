<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GraalPy - example</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</head>
<body class="font-monospace">
    <main class="container my-5">
        <div class="p-5 text-center bg-body-tertiary rounded-3 mb-5">
            <h1 class="text-body-emphasis">GraalPy example</h1>
            {% if current_time %}
                <p>Current server time: <span class="badge text-bg-warning">{{ current_time }}</span></p>
            {% else %}
                <p>No time has been supplied!</p>
            {% endif %}
        </div>

        <div>
            <h2>Events</h2>
            <div class="mb-3">
                <h3>Add a new event</h3>
                <form>
                    <div class="input-group mb-3">
                        <textarea type="text" class="form-control" placeholder="Event's details" aria-label="Event's details" aria-describedby="button-addon2" maxlength="250"></textarea>
                        <button class="btn btn-primary" type="submit" id="button-addon2">Add</button>
                    </div>
                </form>
            </div>

            <div>
                <h3>Event list</h3>
            </div>
        </div>
    </main>
</body>
</html>
